<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overflow probe</title>

<!--
  WHY THIS FILE LOOKS LIKE THIS — do not "simplify" it back.

  The first version of this probe measured ITSELF. It walked
  `document.querySelectorAll('body *')` on this page, which contains nothing but
  its own four elements, so it reported "nothing found" every single time and
  was mistaken for evidence that the overflow had gone away. It never looked at
  the tool page at all.

  A static file in public/ cannot reach into another route. So this version
  loads the target route into a same-origin <iframe> and walks the DOM inside
  it. Same origin means contentDocument is readable; no build step, no
  component to mount, no TypeScript, nothing that can break a Vercel build.

  THE IFRAME IS SIZED TO THIS PHONE'S REAL VIEWPORT WIDTH. That is the whole
  point — the bug reproduces at ~360px and not at desktop widths, so measuring
  at any other width proves nothing.

  THE IFRAME IS 6000px TALL ON PURPOSE. A short iframe gives the inner document
  a short viewport, which introduces a vertical scrollbar and changes the
  available width. Tall enough to hold the whole page means no inner scrollbar
  and honest widths.

  `overflow-x: clip` on html/body (phases 53-54) means the DOCUMENT stops
  reporting an oversized scrollWidth while the offending element is still
  physically past the right edge. That is why this measures every element's
  getBoundingClientRect().right instead of trusting scrollWidth. Both are
  printed so the difference is visible.

  DELETE THIS FILE once the offending element is named and fixed.
-->

<style>
  body { font: 14px/1.45 system-ui, sans-serif; margin: 0; padding: 12px;
         background: #101010; color: #ececec; }
  h3 { margin: 0 0 4px; }
  p.hint { margin: 0 0 10px; opacity: .65; }
  input { font: 14px system-ui; padding: 9px; border-radius: 6px;
          border: 1px solid #3a3a3a; background: #1b1b1b; color: #ececec;
          width: 55%; }
  button { font: 14px system-ui; font-weight: 600; padding: 10px 14px;
           border-radius: 6px; border: 0; background: #ff6a00; color: #101010; }
  ul { padding-left: 18px; margin: 8px 0; }
  li { margin: 9px 0; word-break: break-all; }
  b { color: #ff9a3c; }
  .meta { opacity: .7; }
  .err { color: #ff6b6b; }
  .chain { opacity: .6; font-size: 13px; margin: 4px 0 0 0; }
  /* Parked far off-screen rather than display:none — a display:none iframe
     lays out at zero width and every measurement comes back wrong. */
  #frame { position: absolute; left: -20000px; top: 0; border: 0; }
</style>

<h3>Overflow probe</h3>
<p class="hint">Type the path of the page to measure, then tap Probe.</p>

<div>
  <input id="path" value="/" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button id="go">Probe</button>
</div>

<div id="out" style="margin-top:14px">Idle.</div>

<iframe id="frame" title="probe target"></iframe>

<script>
(function () {
  var out = document.getElementById('out');
  var frame = document.getElementById('frame');
  var pathEl = document.getElementById('path');

  document.getElementById('go').addEventListener('click', run);
  pathEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') run();
  });

  function run() {
    var p = pathEl.value.trim() || '/';
    if (p.charAt(0) !== '/') p = '/' + p;

    // Cache-bust so a repeat probe after a deploy does not measure a stale page.
    var url = p + (p.indexOf('?') < 0 ? '?' : '&') + 'probe=' + Date.now();

    var vw = document.documentElement.clientWidth;
    frame.style.width = vw + 'px';
    frame.style.height = '6000px';

    out.textContent = 'Loading ' + p + ' at ' + vw + 'px wide…';

    frame.onload = function () {
      // Settle time: fonts, images and any client component that reflows on
      // mount will change widths after load fires.
      setTimeout(function () { measure(vw); }, 2000);
    };
    frame.onerror = function () {
      out.innerHTML = '<p class="err">The frame failed to load. Check the path.</p>';
    };
    frame.src = url;
  }

  function describe(el) {
    var id = el.tagName.toLowerCase();
    if (el.id) id += '#' + el.id;
    if (el.className && typeof el.className === 'string') {
      var cls = el.className.trim().split(/\s+/).slice(0, 5);
      if (cls.length && cls[0]) id += '.' + cls.join('.');
    }
    return id;
  }

  function chainOf(el) {
    var parts = [], node = el.parentElement, depth = 0;
    while (node && node.tagName !== 'BODY' && depth < 5) {
      parts.push(describe(node));
      node = node.parentElement;
      depth++;
    }
    return parts.join('  <  ');
  }

  function measure(outerVw) {
    var doc = null;
    try { doc = frame.contentDocument; } catch (e) { doc = null; }

    if (!doc || !doc.body) {
      out.innerHTML =
        '<p class="err">Blocked — the page would not open inside a frame.</p>' +
        '<p>Send Claude this exact sentence: <b>framing blocked, contentDocument null</b>. ' +
        'It means a frame-ancestors or X-Frame-Options header is set and the probe ' +
        'has to become a mounted component instead.</p>';
      return;
    }

    var vw = doc.documentElement.clientWidth;
    var win = doc.defaultView;
    var sx = (win && win.scrollX) || 0;

    var bad = [];
    var all = doc.querySelectorAll('body *');

    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      var r = el.getBoundingClientRect();
      if (r.width === 0 && r.height === 0) continue;

      var right = r.right + sx;
      if (right > vw + 1) {
        bad.push({
          el: el,
          over: Math.round(right - vw),
          w: Math.round(r.width),
          left: Math.round(r.left + sx)
        });
      }
    }

    bad.sort(function (a, b) { return b.over - a.over; });

    var head =
      '<p class="meta">probe viewport ' + outerVw + 'px &middot; ' +
      'page viewport ' + vw + 'px &middot; ' +
      'documentElement.scrollWidth ' + doc.documentElement.scrollWidth + 'px &middot; ' +
      'body.scrollWidth ' + doc.body.scrollWidth + 'px &middot; ' +
      bad.length + ' element(s) past the edge</p>';

    if (!bad.length) {
      out.innerHTML = head + '<p>Nothing extends past the right edge at this width.</p>';
      return;
    }

    var rows = '';
    for (var j = 0; j < Math.min(bad.length, 15); j++) {
      var b = bad[j];
      rows +=
        '<li><b>+' + b.over + 'px</b> &mdash; ' + describe(b.el) +
        '<br><span class="meta">width ' + b.w + ', left ' + b.left + '</span>' +
        '<div class="chain">in: ' + (chainOf(b.el) || 'body') + '</div></li>';
    }

    out.innerHTML = head + '<ul>' + rows + '</ul>' +
      '<p class="meta">The deepest element in the list is usually the cause; ' +
      'the ones above it are ancestors stretched by it.</p>';
  }
})();
</script>
